<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karty pojazdów – warsztat</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #d6d9de;
    --text: #1c1e21;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 32px 0 12px; }
  .layout {
    display: grid;
    gap: 32px;
    max-width: 1000px;
    margin: 0 auto;
    grid-template-columns: minmax(320px, 420px) 1fr;
    align-items: start;
  }
  @media (max-width: 640px) {
    body { padding: 16px; }
    .layout {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .layout > section { min-width: 0; width: 100%; }
    form { width: 100%; }
    h2 { margin-top: 8px; }
  }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .field { margin-bottom: 14px; }
  .field:last-of-type { margin-bottom: 20px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--muted);
  }
  input, textarea {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 0;
    border-color: var(--accent);
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }

  .select-rok { position: relative; }
  .panel-rok {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 10;
    max-height: 220px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    padding: 4px;
  }
  .panel-rok button {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 0;
    border-radius: 4px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .panel-rok button:hover { background: #eef2ff; }
  .panel-rok button[aria-selected="true"] {
    background: var(--accent);
    color: #fff;
  }
  .panel-rok .brak { padding: 8px 10px; color: var(--muted); }

  #szukaj {
    width: 100%;
    margin-bottom: 14px;
    padding: 9px 12px;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  #szukaj:focus {
    outline: 2px solid var(--accent);
    outline-offset: 0;
    border-color: var(--accent);
  }
  .lista { display: grid; gap: 14px; }
  .naglowek-sekcji {
    font-size: 14px;
    font-weight: 700;
    margin: 22px 0 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .naglowek-sekcji:first-of-type { margin-top: 4px; }
  .licznik { color: var(--muted); font-weight: 600; font-size: 13px; }
  .pusto { color: var(--muted); }
  .karta {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .karta-naglowek {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .karta-podtytul {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .karta dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 14px;
    margin: 0;
  }
  .karta dt { color: var(--muted); font-size: 13px; }
  .karta dd { margin: 0; }
  .karta .opis {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
  }
  .karta.zakonczona {
    opacity: .72;
    border-left-color: var(--muted);
  }
  .karta-stopka {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .karta-stopka button {
    padding: 7px 12px;
    font-size: 13px;
  }
  .btn-przywroc {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  .btn-przywroc:hover { background: #eef2ff; }
  .znacznik-zakonczone {
    color: #15803d;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="layout">
  <section>
    <h1>Nowe zlecenie / karta pojazdu</h1>
    <form id="formularz">
      <div class="field">
        <label for="nrRej">Nr rejestracyjny</label>
        <input id="nrRej" name="nrRej" required>
      </div>
      <div class="field">
        <label for="marka">Marka</label>
        <input id="marka" name="marka" required>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" name="model" required>
      </div>
      <div class="field">
        <label for="wersja">Wersja</label>
        <input id="wersja" name="wersja">
      </div>
      <div class="field">
        <label for="rok">Rok produkcji</label>
        <div class="select-rok">
          <input id="rok" name="rok" type="text" inputmode="numeric" autocomplete="off"
                 placeholder="kliknij, aby wybrać" aria-haspopup="listbox" aria-expanded="false">
          <div id="panelRok" class="panel-rok" role="listbox" hidden></div>
        </div>
      </div>
      <div class="field">
        <label for="silnik">Silnik (kod silnika)</label>
        <input id="silnik" name="silnik">
      </div>
      <div class="field">
        <label for="pojMoc">Pojemność / moc</label>
        <input id="pojMoc" name="pojMoc" placeholder="np. 1968 cm³ / 150 KM">
      </div>
      <div class="field">
        <label for="licznik">Stan licznika</label>
        <input id="licznik" name="licznik" placeholder="np. 187 500 km">
      </div>
      <div class="field">
        <label for="opis">Opis zlecenia</label>
        <textarea id="opis" name="opis"></textarea>
      </div>
      <button type="submit">Dodaj kartę</button>
    </form>
  </section>

  <section>
    <h2>Lista kart</h2>
    <input id="szukaj" type="search" placeholder="Szukaj: nr rejestracyjny, marka, model" autocomplete="off">
    <p id="status" class="pusto" hidden></p>
    <h3 class="naglowek-sekcji">Aktywne <span id="licznikAktywne" class="licznik"></span></h3>
    <div id="listaAktywne" class="lista"></div>
    <h3 class="naglowek-sekcji">Zakończone <span id="licznikZakonczone" class="licznik"></span></h3>
    <div id="listaZakonczone" class="lista"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Konfiguracja Supabase ---
  const SUPABASE_URL = 'https://xkobylmfcnlgdldxthpv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_L3J_00mzpmlOqSOh-ACMgQ_Af0tH-rv';
  const sb = window.supabase && window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const formularz = document.getElementById('formularz');
  const szukaj = document.getElementById('szukaj');
  const statusEl = document.getElementById('status');
  const listaAktywne = document.getElementById('listaAktywne');
  const listaZakonczone = document.getElementById('listaZakonczone');
  const licznikAktywne = document.getElementById('licznikAktywne');
  const licznikZakonczone = document.getElementById('licznikZakonczone');
  const przyciskDodaj = formularz.querySelector('button[type="submit"]');

  // --- Panel z rocznikami dla pola "Rok produkcji" ---
  const inputRok = document.getElementById('rok');
  const panelRok = document.getElementById('panelRok');
  const ROK_OD = 1970;
  const ROK_DO = new Date().getFullYear();

  for (let r = ROK_DO; r >= ROK_OD; r--) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(r);
    b.setAttribute('role', 'option');
    panelRok.append(b);
  }

  function odswiezPanelRok() {
    const szukaj = inputRok.value.trim();
    let widoczne = 0;
    panelRok.querySelectorAll('button').forEach(function (b) {
      const pasuje = szukaj === '' || b.textContent.indexOf(szukaj) === 0;
      b.hidden = !pasuje;
      if (pasuje) widoczne++;
      b.setAttribute('aria-selected', b.textContent === szukaj ? 'true' : 'false');
    });
    let brak = panelRok.querySelector('.brak');
    if (widoczne === 0) {
      if (!brak) {
        brak = document.createElement('div');
        brak.className = 'brak';
        brak.textContent = 'Brak pasującego rocznika';
        panelRok.append(brak);
      }
    } else if (brak) {
      brak.remove();
    }
  }

  function otworzPanelRok() {
    odswiezPanelRok();
    panelRok.hidden = false;
    inputRok.setAttribute('aria-expanded', 'true');
    const wybrany = panelRok.querySelector('button[aria-selected="true"]');
    if (wybrany) wybrany.scrollIntoView({ block: 'nearest' });
  }

  function zamknijPanelRok() {
    panelRok.hidden = true;
    inputRok.setAttribute('aria-expanded', 'false');
  }

  inputRok.addEventListener('focus', otworzPanelRok);
  inputRok.addEventListener('click', otworzPanelRok);
  inputRok.addEventListener('input', function () {
    if (panelRok.hidden) otworzPanelRok();
    else odswiezPanelRok();
  });
  inputRok.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { zamknijPanelRok(); }
    if (e.key === 'Enter' && !panelRok.hidden) { e.preventDefault(); zamknijPanelRok(); }
  });

  panelRok.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    inputRok.value = b.textContent;
    zamknijPanelRok();
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.select-rok')) zamknijPanelRok();
  });

  // Zwraca wartość pola albo kreskę, gdy puste.
  function wartosc(v) {
    v = (v == null ? '' : String(v)).trim();
    return v === '' ? '—' : v;
  }

  function utworzKarte(d) {
    const karta = document.createElement('div');
    karta.className = 'karta';
    karta.dataset.filtr = [d.nrRej, d.marka, d.model]
      .map(function (x) { return x == null ? '' : String(x); })
      .join(' ').toLowerCase();

    const tytul = [d.marka, d.model, d.wersja].filter(Boolean).join(' ').trim() || 'Pojazd';
    const podtytul = [
      d.nrRej ? 'Nr rej.: ' + d.nrRej : null,
      d.rok ? 'Rok: ' + d.rok : null
    ].filter(Boolean).join('  •  ');

    const naglowek = document.createElement('div');
    naglowek.className = 'karta-naglowek';
    naglowek.textContent = tytul;

    const pod = document.createElement('div');
    pod.className = 'karta-podtytul';
    pod.textContent = podtytul;

    const dl = document.createElement('dl');
    const wiersze = [
      ['Nr rejestracyjny', d.nrRej],
      ['Marka', d.marka],
      ['Model', d.model],
      ['Wersja', d.wersja],
      ['Rok produkcji', d.rok],
      ['Silnik (kod)', d.silnik],
      ['Pojemność / moc', d.pojMoc],
      ['Stan licznika', d.licznik]
    ];
    for (const [etykieta, v] of wiersze) {
      const dt = document.createElement('dt');
      dt.textContent = etykieta;
      const dd = document.createElement('dd');
      dd.textContent = wartosc(v);
      dl.append(dt, dd);
    }

    karta.append(naglowek, pod, dl);

    if ((d.opis || '').trim() !== '') {
      const opis = document.createElement('div');
      opis.className = 'opis';
      opis.textContent = 'Opis zlecenia:\n' + d.opis.trim();
      karta.append(opis);
    }

    const stopka = document.createElement('div');
    stopka.className = 'karta-stopka';
    if (d.zakonczone) {
      karta.classList.add('zakonczona');
      const znacznik = document.createElement('span');
      znacznik.className = 'znacznik-zakonczone';
      znacznik.textContent = '✓ Zlecenie zakończone';
      const przywroc = document.createElement('button');
      przywroc.type = 'button';
      przywroc.className = 'btn-przywroc';
      przywroc.textContent = 'Przywróć do aktywnych';
      przywroc.addEventListener('click', function () { zmienStan(d, karta, false); });
      stopka.append(znacznik, przywroc);
    } else {
      const zakoncz = document.createElement('button');
      zakoncz.type = 'button';
      zakoncz.className = 'btn-zakoncz';
      zakoncz.textContent = 'Zakończ zlecenie';
      zakoncz.addEventListener('click', function () { zmienStan(d, karta, true); });
      stopka.append(zakoncz);
    }
    karta.append(stopka);

    return karta;
  }

  // --- Mapowanie: formularz <-> kolumny tabeli "karty" ---
  function tekstAlboNull(v) {
    v = (v || '').trim();
    return v === '' ? null : v;
  }

  function formularzDoWiersza(d) {
    return {
      nr_rejestracyjny: tekstAlboNull(d.nrRej),
      marka: tekstAlboNull(d.marka),
      model: tekstAlboNull(d.model),
      wersja: tekstAlboNull(d.wersja),
      rok_produkcji: tekstAlboNull(d.rok),
      silnik: tekstAlboNull(d.silnik),
      pojemnosc_moc: tekstAlboNull(d.pojMoc),
      stan_licznika: tekstAlboNull(d.licznik),
      opis_zlecenia: tekstAlboNull(d.opis)
    };
  }

  function wierszDoKarty(w) {
    return {
      id: w.id,
      zakonczone: !!w.zakonczone,
      nrRej: w.nr_rejestracyjny,
      marka: w.marka,
      model: w.model,
      wersja: w.wersja,
      rok: w.rok_produkcji,
      silnik: w.silnik,
      pojMoc: w.pojemnosc_moc,
      licznik: w.stan_licznika,
      opis: w.opis_zlecenia
    };
  }

  function pokazKomunikat(tekst, blad) {
    statusEl.textContent = tekst || '';
    statusEl.style.color = blad ? '#b91c1c' : '';
    statusEl.hidden = !tekst;
  }

  // Placeholdery i liczniki dla sekcji "Aktywne" / "Zakończone".
  function odswiezSekcje() {
    [[listaAktywne, licznikAktywne, 'Brak aktywnych zleceń.'],
     [listaZakonczone, licznikZakonczone, 'Brak zakończonych zleceń.']].forEach(function (para) {
      const el = para[0], licznikEl = para[1], pustyTekst = para[2];
      const karty = el.querySelectorAll('.karta');
      const widoczne = el.querySelectorAll('.karta:not([hidden])').length;
      licznikEl.textContent = karty.length ? '(' + karty.length + ')' : '';
      let info = el.querySelector('.info-sekcji');
      let tekst = '';
      if (karty.length === 0) tekst = pustyTekst;
      else if (widoczne === 0) tekst = 'Brak kart pasujących do wyszukiwania.';
      if (tekst) {
        if (!info) {
          info = document.createElement('p');
          info.className = 'pusto info-sekcji';
          el.append(info);
        }
        info.textContent = tekst;
      } else if (info) {
        info.remove();
      }
    });
  }

  // --- Wczytanie istniejących kart z Supabase przy otwarciu strony ---
  async function wczytajKarty() {
    if (!sb) {
      pokazKomunikat('Nie załadowano biblioteki Supabase (sprawdź połączenie z internetem).', true);
      return;
    }
    pokazKomunikat('Wczytywanie...', false);
    let { data, error } = await sb.from('karty').select('*').order('id', { ascending: false });
    if (error) {
      ({ data, error } = await sb.from('karty').select('*'));
    }
    if (error) {
      pokazKomunikat('Nie udało się wczytać kart: ' + error.message, true);
      return;
    }
    pokazKomunikat('');
    listaAktywne.innerHTML = '';
    listaZakonczone.innerHTML = '';
    (data || []).forEach(function (w) {
      const d = wierszDoKarty(w);
      (d.zakonczone ? listaZakonczone : listaAktywne).append(utworzKarte(d));
    });
    filtrujKarty();
  }

  // --- Zapis nowej karty do Supabase po submit ---
  formularz.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!sb) {
      alert('Nie załadowano biblioteki Supabase (sprawdź połączenie z internetem).');
      return;
    }

    const fd = new FormData(formularz);
    const wiersz = formularzDoWiersza({
      nrRej: fd.get('nrRej'),
      marka: fd.get('marka'),
      model: fd.get('model'),
      wersja: fd.get('wersja'),
      rok: fd.get('rok'),
      silnik: fd.get('silnik'),
      pojMoc: fd.get('pojMoc'),
      licznik: fd.get('licznik'),
      opis: fd.get('opis')
    });

    przyciskDodaj.disabled = true;
    const { data, error } = await sb.from('karty').insert(wiersz).select();
    przyciskDodaj.disabled = false;

    if (error) {
      alert('Nie udało się zapisać karty: ' + error.message);
      return;
    }

    const zapisany = (data && data[0]) ? wierszDoKarty(data[0]) : wierszDoKarty(wiersz);
    zapisany.zakonczone = false;
    listaAktywne.prepend(utworzKarte(zapisany));
    filtrujKarty();
    formularz.reset();
    document.getElementById('nrRej').focus();
  });

  // --- Filtrowanie kart po nr rejestracyjnym, marce i modelu (lokalnie, bez zapytań) ---
  function filtrujKarty() {
    const q = szukaj.value.trim().toLowerCase();
    document.querySelectorAll('#listaAktywne .karta, #listaZakonczone .karta').forEach(function (k) {
      k.hidden = q !== '' && (k.dataset.filtr || '').indexOf(q) === -1;
    });
    odswiezSekcje();
  }

  // --- Przenoszenie zlecenia między "Aktywne" a "Zakończone" (zapis w Supabase) ---
  async function zmienStan(d, kartaEl, zakoncz) {
    if (!sb) {
      alert('Nie załadowano biblioteki Supabase (sprawdź połączenie z internetem).');
      return;
    }
    if (d.id == null) {
      alert('Brak identyfikatora karty — odśwież stronę i spróbuj ponownie.');
      return;
    }
    if (zakoncz && !window.confirm('Czy na pewno chcesz zakończyć to zlecenie?')) return;

    const { error } = await sb.from('karty').update({ zakonczone: zakoncz }).eq('id', d.id);
    if (error) {
      alert('Nie udało się zaktualizować zlecenia: ' + error.message);
      return;
    }

    d.zakonczone = zakoncz;
    kartaEl.remove();
    (zakoncz ? listaZakonczone : listaAktywne).prepend(utworzKarte(d));
    filtrujKarty();
  }

  szukaj.addEventListener('input', filtrujKarty);

  wczytajKarty();
</script>

</body>
</html>
